
services:
  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-illuqc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-illuqcdb}
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d:ro
      - ${POSTGRES_DATA_DIR:?Set POSTGRES_DATA_DIR in .env}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-illuqc} -d ${POSTGRES_DB:-illuqcdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  parser:
    build:
      context: .
      dockerfile: Dockerfile.parser
    image: ${PROJECT_NAME:-illuqc}_parser:${ILLUQC_VERSION:-0.1.0}
    profiles: ["tools"]
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    volumes:
      - ${ILLUMINA_RAW_DATA_DIR:?Set ILLUMINA_RAW_DATA_DIR in .env}:/data/raw/illumina:ro
      - ${THERMOFISHER_RAW_DATA_DIR:?Set THERMOFISHER_RAW_DATA_DIR in .env}:/data/raw/thermofisher:ro
      - ${PROCESSED_DATA_DIR:?Set PROCESSED_DATA_DIR in .env}:/data/processed
      - ${LOG_DIR:?Set LOG_DIR in .env}:/logs
    environment:
      PARSER_LOG_LEVEL: ${PARSER_LOG_LEVEL:-INFO}
    restart: "no"

  loader:
    build:
      context: .
      dockerfile: Dockerfile.loader
    image: ${PROJECT_NAME:-illuqc}_loader:${ILLUQC_VERSION:-0.1.0}
    profiles: ["tools"]
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${PROCESSED_DATA_DIR:?Set PROCESSED_DATA_DIR in .env}:/data/processed:ro
      - ./db:/opt/illuqc/db:ro
      - ${LOG_DIR:?Set LOG_DIR in .env}:/logs
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-illuqcdb}
      POSTGRES_USER: ${POSTGRES_USER:-illuqc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PYTHONUNBUFFERED: "1"
    restart: "no"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    image: ${PROJECT_NAME:-illuqc}_streamlit:${ILLUQC_VERSION:-0.1.0}
    depends_on:
      db:
        condition: service_healthy
    user: "${LOCAL_UID:-10001}:${LOCAL_GID:-10001}"
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - ./app:/opt/illuqc/app
      - ${CONFIG_DIR:?Set CONFIG_DIR in .env}:/config:ro
      - ${LOG_DIR:?Set LOG_DIR in .env}:/logs
    environment:
      ILLUQC_VERSION: ${ILLUQC_VERSION:-0.1.0}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-illuqcdb}
      DB_USER: ${POSTGRES_USER:-illuqc}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
